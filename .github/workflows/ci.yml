name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node tests/messages.test.mjs
      - name: Clipboard tests
        run: node tests/clipboard.test.mjs

  bundle:
    name: bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Bun build
        run: >
          bun build ./tui.ts
          --target bun
          --jsx-runtime automatic
          --jsx-import-source @opentui/solid
          --external @opencode/plugin/tui
          --external @opentui/core
          --external @opentui/solid
          --external solid-js
          --outfile ./dist/check.js
